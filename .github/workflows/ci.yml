name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Smoke-test the installed package
        run: |
          python -c "import spam_detector; print('version', spam_detector.__version__)"
          spam-detector-train --help
          spam-detector-data --help

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest -q --cov --cov-report=term-missing

      - name: Train end to end on the bundled sample dataset
        run: |
          spam-detector-train --data samples/sample_messages.tsv --model-dir /tmp/ci-model
          test -f /tmp/ci-model/spam_model.joblib
          test -f /tmp/ci-model/metrics.json

  docker:
    name: docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t spam-detector:ci .

      - name: Verify the API answers /health
        run: |
          docker run -d --name spam-api -p 8000:8000 spam-detector:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "API is healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy in time."
          docker logs spam-api
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs spam-api || true
