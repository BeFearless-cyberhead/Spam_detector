[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-detector"
version = "1.0.0"
description = "SMS spam detection with a scikit-learn TF-IDF pipeline, a Streamlit UI, and a FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit" }]
keywords = [
  "spam-detection",
  "nlp",
  "machine-learning",
  "scikit-learn",
  "streamlit",
  "fastapi",
  "text-classification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "scikit-learn>=1.7,<2",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35,<2"]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "pre-commit>=3,<5",
]
all = [
  "streamlit>=1.35,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "pre-commit>=3,<5",
]

[project.urls]
Homepage = "https://github.com/BeFearless-cyberhead/spam-detector"
Source = "https://github.com/BeFearless-cyberhead/spam-detector"
Issues = "https://github.com/BeFearless-cyberhead/spam-detector/issues"

[tool.setuptools]
# Flat, script-style layout: no importable package, just top-level modules.
packages = []
py-modules = ["api", "app", "download_data", "spam_model", "train"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["api", "app", "spam_model", "train"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = [
  "A",    # builtins shadowing
  "B",    # bugbear
  "BLE",  # blind except
  "C4",   # comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PTH",  # pathlib
  "RET",  # return statements
  "RUF",  # ruff-specific
  "SIM",  # simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D103", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "download_data", "spam_model", "train"]
